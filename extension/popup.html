<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; color: #1d1d1f; }
    @media (prefers-color-scheme: dark) { body { background: #232428; color: #ececee; } textarea, input { background: #1b1c1f; color: #ececee; border-color: #34363c !important; } }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 20px; }
    .status { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #9a9ca3; }
    .on .dot { background: #22c55e; } .off .dot { background: #ef4444; }
    label { display: block; margin: 8px 0 4px; font-size: 12px; opacity: 0.8; }
    .check { display: flex; gap: 8px; align-items: center; opacity: 1; font-size: 13px; }
    input[type=number], textarea { width: 100%; box-sizing: border-box; border: 1px solid #dedee2; border-radius: 6px; padding: 6px; font: inherit; }
    textarea { height: 70px; resize: vertical; font-size: 11px; }
    .row { display: flex; gap: 8px; } .row > div { flex: 1; }
    .saved { font-size: 11px; color: #22c55e; height: 14px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="" /> MacDM</h1>
  <div id="status" class="status"><span class="dot"></span><span id="statusText">Memeriksa…</span></div>
  <label class="check"><input type="checkbox" id="enabled" /> Tangkap download otomatis</label>
  <div class="row">
    <div><label>Port app</label><input type="number" id="port" min="1024" max="65535" /></div>
    <div><label>Ukuran min. (MB)</label><input type="number" id="minSizeMB" min="0" /></div>
  </div>
  <label>Ekstensi yang ditangkap</label>
  <textarea id="extensions"></textarea>
  <div id="saved" class="saved"></div>
  <script src="popup.js"></script>
</body>
</html>
